<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  /* webOS 6 runs Chromium 79: no `inset`, no `gap` on flex rows, outlines ignore border-radius. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #f5f5f7;
    font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Ambient light: the focused app's colour, faded out by a black vignette. Only
     background-color animates, so the GPU never re-rasterises a gradient. */
  #ambient { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background-color: #1c1c1e;
    transition: background-color .6s ease; }
  #vignette { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    background: radial-gradient(140% 85% at 30% 0%, rgba(0,0,0,.35) 0%, rgba(0,0,0,.88) 45%, #000 72%); }

  #clock { position: absolute; top: 64px; right: 112px; text-align: right; }
  #time { font-size: 60px; font-weight: 300; letter-spacing: -1px; line-height: 1; }
  #date { font-size: 24px; color: rgba(245,245,247,.5); margin-top: 12px; }

  #hero { position: absolute; left: 112px; top: 268px; }
  #title { font-size: 96px; font-weight: 700; letter-spacing: -3px; line-height: 1;
    transition: opacity .45s cubic-bezier(.16,1,.3,1), transform .45s cubic-bezier(.16,1,.3,1); }
  #title.out { opacity: 0; transform: translateY(14px); transition: none; }
  #hint { font-size: 24px; color: rgba(245,245,247,.42); margin-top: 22px; }

  .row { position: absolute; left: 0; width: 1920px; padding: 0 112px; white-space: nowrap; }
  .track { display: inline-block; transition: transform .5s cubic-bezier(.16,1,.3,1); }
  #dock { top: 488px; height: 280px; }
  #dock .tile { width: 336px; height: 200px; margin-right: 44px; border-radius: 30px; }
  #moreLabel { position: absolute; left: 112px; top: 812px; font-size: 22px; font-weight: 600;
    color: rgba(245,245,247,.38); letter-spacing: 3px; text-transform: uppercase; }
  #more { top: 860px; height: 200px; }
  #more .tile { width: 200px; height: 120px; margin-right: 28px; border-radius: 20px; }

  .tile { display: inline-block; position: relative; vertical-align: top; overflow: hidden;
    background: #2c2c2e; box-shadow: 0 8px 20px rgba(0,0,0,.45);
    transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s cubic-bezier(.16,1,.3,1), opacity .3s ease;
    will-change: transform; }
  .tile img, .tile svg { position: absolute; left: 50%; top: 50%; }
  .tile img { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 26px;
    box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .tile svg { width: 96px; height: 96px; margin: -48px 0 0 -48px; }
  #more .tile img { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 16px; }
  #more .tile svg { width: 60px; height: 60px; margin: -30px 0 0 -30px; }

  /* Focus: lift toward the viewer, white ring that follows the corner radius, and one
     light sweep across the glass. */
  .tile.focus { transform: translateY(-14px) scale(1.1);
    box-shadow: 0 0 0 5px rgba(255,255,255,.95), 0 34px 60px rgba(0,0,0,.75); z-index: 2; }
  .tile::after { content: ""; position: absolute; top: 0; left: -60%; width: 50%; height: 100%; opacity: 0;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 100%); }
  .tile.focus::after { animation: sweep .9s cubic-bezier(.16,1,.3,1) .05s 1; }
  @keyframes sweep { 0% { opacity: 1; transform: translateX(0) skewX(-12deg); }
                     100% { opacity: 1; transform: translateX(420%) skewX(-12deg); } }
  .tile.focus .shine { opacity: 1; }
  .shine { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .4s ease;
    background: linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 45%); }

  .tile.moving { animation: wiggle .22s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: translateY(-14px) scale(1.1) rotate(-1.4deg); }
                      to   { transform: translateY(-14px) scale(1.1) rotate(1.4deg); } }

  .row.dim .tile { opacity: .62; }
  .row.dim .tile.focus { opacity: 1; }

  /* First paint: dock and grid rise in once, staggered, finished well inside 1.2s. */
  body.enter .tile { animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
  body.enter #hero, body.enter #clock, body.enter #moreLabel { animation: fade .6s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body class="enter">
<div id="ambient"></div>
<div id="vignette"></div>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="hero"><div id="title"></div><div id="hint"></div></div>
<div id="dock" class="row"><div class="track"></div></div>
<div id="moreLabel">All apps</div>
<div id="more" class="row dim"><div class="track"></div></div>
<script src="apps.js"></script>
<script src="main.js"></script>
</body>
</html>
