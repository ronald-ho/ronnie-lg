<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  /* webOS 6 runs Chromium 79 at devicePixelRatio 2, so every repaint is rasterised at 4K.
     Rule for this file: only transform and opacity ever animate. No `inset`, no flex `gap`. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #f5f5f7;
    font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .full { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }

  /* Ambient light: two solid layers crossfaded by opacity under a static vignette layer. */
  .ambient { opacity: 0; transition: opacity .5s ease; transform: translateZ(0); }
  .ambient.on { opacity: 1; }
  #vignette { transform: translateZ(0);
    background: radial-gradient(140% 85% at 30% 0%, rgba(0,0,0,.35) 0%, rgba(0,0,0,.88) 45%, #000 72%); }

  #clock { position: absolute; top: 64px; right: 112px; text-align: right; }
  #time { font-size: 60px; font-weight: 300; letter-spacing: -1px; line-height: 1; }
  #date { font-size: 28px; color: rgba(245,245,247,.68); margin-top: 12px; }

  #hero { position: absolute; left: 112px; top: 200px; }
  #title { font-size: 96px; font-weight: 700; letter-spacing: -3px; line-height: 1.05; }
  #hint { font-size: 28px; color: rgba(245,245,247,.66); margin-top: 18px; }

  .label { position: absolute; left: 112px; font-size: 24px; font-weight: 600; color: rgba(245,245,247,.6);
    letter-spacing: 3px; text-transform: uppercase; }
  .row { position: absolute; left: 0; width: 1920px; padding: 0 112px; white-space: nowrap; }
  .track { display: inline-block; transition: transform .45s cubic-bezier(.16,1,.3,1); will-change: transform; }
  #dock { top: 420px; height: 260px; }
  #dock .tile { width: 336px; height: 200px; margin-right: 44px; border-radius: 30px; }
  #tvLabel { top: 700px; }
  #tv { top: 770px; height: 200px; }
  #tv .tile { width: 240px; height: 135px; margin-right: 32px; border-radius: 22px; }

  .tile { display: inline-block; position: relative; vertical-align: top; background: #2c2c2e;
    transition: transform .35s cubic-bezier(.16,1,.3,1); }
  /* Ring and lift shadow are painted once into ::before and only faded, never re-blurred. */
  .tile::before { content: ""; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
    border-radius: inherit; opacity: 0; transition: opacity .2s ease;
    box-shadow: 0 0 0 5px #fff, 0 0 0 9px rgba(0,0,0,.55), 0 30px 50px rgba(0,0,0,.7); }
  .tile .clip { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: inherit;
    overflow: hidden; }
  .tile img, .tile svg { position: absolute; left: 50%; top: 50%; }
  .tile img { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 26px; }
  .tile svg { width: 96px; height: 96px; margin: -48px 0 0 -48px; }
  .tile .shine { position: absolute; top: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0)); }

  .tile.focus { transform: translateY(-14px) scale(1.1); z-index: 2; }
  .tile.focus::before { opacity: 1; }
  .tile.focus.press { transform: translateY(-10px) scale(1.04); transition-duration: .08s; }
  .tile.nudgeL { animation: nudgeL .15s ease-out; }
  .tile.nudgeR { animation: nudgeR .15s ease-out; }
  @keyframes nudgeL { 50% { transform: translate(-6px,-14px) scale(1.1); } }
  @keyframes nudgeR { 50% { transform: translate(6px,-14px) scale(1.1); } }
  .tile.moving { animation: wiggle .22s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: translateY(-14px) scale(1.1) rotate(-1.4deg); }
                      to   { transform: translateY(-14px) scale(1.1) rotate(1.4deg); } }

  .chan .num { position: absolute; left: 22px; top: 18px; font-size: 44px; font-weight: 700; line-height: 1; }
  .chan .name { position: absolute; left: 22px; bottom: 18px; font-size: 26px; color: rgba(255,255,255,.85); }

  /* App picker overlay for the + tile */
  #picker { background: rgba(0,0,0,.95); z-index: 10; }
  #picker h2 { position: absolute; left: 160px; top: 90px; font-size: 56px; font-weight: 700; }
  #picker p { position: absolute; left: 160px; top: 164px; font-size: 28px; color: rgba(245,245,247,.66); }
  #grid { position: absolute; left: 160px; top: 240px; width: 1640px; transition: transform .35s cubic-bezier(.16,1,.3,1); }
  #grid .tile { width: 240px; height: 144px; margin: 0 32px 76px 0; border-radius: 22px; }
  #grid .cap { position: absolute; left: 0; top: 156px; width: 240px; font-size: 24px; text-align: center;
    color: rgba(245,245,247,.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #grid .tile img { width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 18px; }
  #grid .tile svg { width: 64px; height: 64px; margin: -32px 0 0 -32px; }

  #toast { position: absolute; left: 50%; bottom: 60px; width: 800px; margin-left: -400px; text-align: center;
    font-size: 28px; padding: 18px; border-radius: 18px; background: rgba(60,60,64,.95); opacity: 0;
    transition: opacity .25s ease; z-index: 20; }
  #toast.on { opacity: 1; }

  #content { transition: opacity .3s ease; }
  body.enter #content { opacity: 0; }
</style>
</head>
<body class="enter">
<div id="ambA" class="full ambient"></div>
<div id="ambB" class="full ambient"></div>
<div id="vignette" class="full"></div>
<div id="content" class="full">
  <div id="clock"><div id="time"></div><div id="date"></div></div>
  <div id="hero"><div id="title"></div><div id="hint"></div></div>
  <div id="dock" class="row"><div class="track"></div></div>
  <div id="tvLabel" class="label">Live TV</div>
  <div id="tv" class="row"><div class="track"></div></div>
</div>
<div id="picker" class="full" hidden>
  <h2>Add to dock</h2>
  <p>OK adds the app &nbsp;•&nbsp; Back closes</p>
  <div id="grid"></div>
</div>
<div id="toast"></div>
<script src="apps.js"></script>
<script src="ssap-key.js"></script>
<script src="ssap.js"></script>
<script src="main.js"></script>
</body>
</html>
